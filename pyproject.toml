[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchblocks-local"
version = "0.1.0"
description = "Local-first, source-linked comparison blocks for agent workflows"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
researchblocks = "researchblocks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

